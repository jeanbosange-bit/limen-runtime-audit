name: Sync to Hugging Face Space

# Mirrors the ZeroGPU-compatible Gradio application.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-space-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Hugging Face client
        run: python -m pip install --disable-pip-version-check "huggingface_hub>=0.30,<2"

      - name: Upload to existing Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          if not token:
              raise RuntimeError("GitHub secret HF_TOKEN is missing")

          HfApi(token=token).upload_folder(
              repo_id="jeanbatuli/limen-runtime-audit",
              repo_type="space",
              folder_path=".",
              ignore_patterns=[".git/**", ".github/**", "__pycache__/**", "*.pyc"],
              commit_message="Sync from GitHub main",
          )
          PY
